<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIERRO INDEX</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="space-background"><div class="stars"></div></div>

    <header>
        <div class="logo">HIERRO INDEX <span class="blink">_</span></div>
        
        <div class="controls">
            <button id="btnSound" onclick="toggleSound()" class="btn-sound" title="Activar Sirena">OFF</button>
            <div class="separator" style="width:1px; height:30px; background:#333; margin:0 10px;"></div>

            <input type="text" id="inputName" placeholder="Nombre">
            <input type="text" id="inputTag" placeholder="Tag" style="width: 50px;">
            <button onclick="addPlayer()" class="btn-add">AÑADIR</button>
        </div>
    </header>

    <main id="grid-container">
        <div class="loading">SISTEMA DE VIGILANCIA LISTO. AÑADE OBJETIVOS...</div>
    </main>

    <footer>
        <a href="scout.html" class="scout-link">IR AL MERCADO DE FICHAJES (SCOUT)</a>
    </footer>

    <div id="toast" class="toast hidden">COMANDO DE ESPECTADOR COPIADO</div>
    <audio id="audioSiren" src="sonidos/alarma.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
